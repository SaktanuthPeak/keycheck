[project]
name = "apiapp"
version = "0.1.0"
description = "FastAPI Clean Architecture Starter with Beanie (MongoDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.2",
    "pydantic[email]>=2.9.0",
    "pymongo>=4.9.0",
    "beanie>=2.0.0",
    "motor>=3.6.0",
    "jwcrypto>=1.5.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "fastapi-pagination>=0.12.30",
    "bcrypt>=4.2.0",
    "arq>=0.26.1",
    "redis>=5.1.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "questionary>=2.0.1",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "uvicorn>=0.32.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
controller = "apiapp.cmd.controller:main"
fast = "cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apiapp", "cli"]
