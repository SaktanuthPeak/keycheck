[project]
name = "keycheck-backend"
version = "0.1.0"
description = "KeyCheck API + inference worker (FastAPI, in-memory or MongoDB/Beanie)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "keycheck-ai[ocr]",
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.2",
    "pymongo>=4.9.0",
    "beanie>=2.0.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pillow>=10.0",
    "fastapi-pagination>=0.12.30",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "questionary>=2.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
# W4: Detector bundles (YOLO / Faster R-CNN). Torch comes from the CPU index; not installed by default.
detector = [
    "keycheck-ai[detector]",
    "torch>=2.3",
    "torchvision>=0.18",
]

[dependency-groups]
dev = [
    "uvicorn>=0.32.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
fast = "cli.main:app"

[tool.uv.sources]
keycheck-ai = { path = "../ai", editable = true }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["cli/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW"]
# B008: FastAPI's Depends()/File()/Query() defaults are the idiom
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apiapp", "cli"]
