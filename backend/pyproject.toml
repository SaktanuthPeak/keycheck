[project]
name = "create-fastapi"
version = "0.2.0"
description = "Interactive CLI tool to scaffold enterprise-grade FastAPI projects (SQLModel/PostgreSQL or Beanie/MongoDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "questionary>=2.0.1",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
]

[project.scripts]
create-fastapi = "create_fastapi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include all files under the package (templates need Dockerfile, scripts, .j2, etc.)
include = [
    "create_fastapi/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/create_fastapi",
    "/README.md",
]
